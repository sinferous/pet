<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Luna</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #error-banner {
      display: none;
      background: #ff4d4d;
      color: white;
      padding: 15px;
      font-family: monospace;
      font-size: 14px;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10000;
      white-space: pre-wrap;
      border-bottom: 3px solid #b30000;
    }
  </style>
  <script>
    window.onerror = function(msg, url, line, col, error) {
      const banner = document.getElementById('error-banner');
      if (banner) {
        banner.style.display = 'block';
        banner.textContent = 'Exception occurred:\n' + msg + '\n\nFile: ' + url + '\nLine: ' + line + ':' + col + '\nError: ' + (error ? error.stack : 'N/A');
      }
      return false;
    };
  </script>
</head>
<body>
  <div id="error-banner"></div>
  <div id="petContainer">
    <div id="speechBubble">
      <span id="speechBubbleClose" onclick="closeSpeechBubble(event)">&times;</span>
      <span id="speechBubbleText">💧 Stay hydrated, human!</span>
    </div>
    <canvas id="petCanvas" width="128" height="320"></canvas>
    <div id="promptDialog">
      <label for="promptInput">Interval (minutes):</label>
      <input type="number" id="promptInput" min="1" max="1440" value="60">
      <div class="modal-buttons">
        <button id="promptOkBtn" class="modal-btn ok-btn" onclick="submitPromptDialog()">OK</button>
        <button id="promptCancelBtn" class="modal-btn cancel-btn" onclick="cancelPromptDialog()">Cancel</button>
      </div>
    </div>
    <div id="reminderDialog" style="display: none; position: absolute; top: 70px; left: -26px; width: 180px; background: #fffff0; color: #010101; border: 3px solid #010101; border-radius: 12px; padding: 12px; box-shadow: 4px 4px 0px #010101; z-index: 99999; font-family: 'Courier New', Courier, monospace; box-sizing: border-box; pointer-events: auto;">
      <label style="font-weight: bold; font-size: 11px; display: block; margin-bottom: 4px;">Time (e.g. 14:30):</label>
      <input type="text" id="reminderTimeInput" placeholder="14:30" oninput="formatTimeInput(event)" style="width: 100%; padding: 4px; border: 2px solid #010101; border-radius: 6px; font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 12px; box-sizing: border-box; margin-bottom: 8px; text-align: center; background: #ffffff;">
      
      <label style="font-weight: bold; font-size: 11px; display: block; margin-bottom: 4px;">Message:</label>
      <input type="text" id="reminderMsgInput" placeholder="Reminder!" style="width: 100%; padding: 4px; border: 2px solid #010101; border-radius: 6px; font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 12px; box-sizing: border-box; margin-bottom: 12px; text-align: center; background: #ffffff;">
      
      <div class="modal-buttons">
        <button class="modal-btn ok-btn" onclick="submitReminderDialog()">OK</button>
        <button class="modal-btn cancel-btn" onclick="cancelReminderDialog()">Cancel</button>
      </div>
    </div>
  </div>

  <div id="controlPanel">
    <button onclick="triggerState('idle')">Idle</button>
    <button onclick="triggerState('walk')">Walk</button>
    <button onclick="triggerState('sleep')">Sleep</button>
    <button onclick="triggerState('play')">Play</button>
    <button onclick="triggerState('react')">React (Shy)</button>
    <button onclick="triggerState('drink')">Drink (Water)</button>
    <button onclick="triggerState('laugh')">Laugh (Tears)</button>
    <button onclick="triggerState('jump')">Jump (Hops)</button>
    <button onclick="triggerState('run')">Run</button>
    <button onclick="triggerState('roll')">Roll</button>
    <button onclick="triggerState('woolball')">Wool Ball</button>
    <button onclick="triggerState('cheer')">Cheer</button>
    <button onclick="triggerState('love')">Love</button>
    <button onclick="triggerState('anger')">Anger</button>
    <div class="waterIntervalRow">
      <label for="waterIntervalInput">Hydration alert every</label>
      <input type="number" id="waterIntervalInput" min="1" max="1440" value="60">
      <span>min</span>
      <button onclick="applyWaterInterval()">Set</button>
    </div>
    <button onclick="parkPet()">Idle / Free</button>
    <button onclick="showSayBubble()">Say</button>
    <button onclick="showReminderDialog()">Custom Reminder</button>
  </div>

  <script src="behavior.js"></script>
  <script src="app.js"></script>
</body>
</html>
